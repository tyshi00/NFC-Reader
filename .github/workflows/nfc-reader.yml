name: NFC Reader

on:
  push:
    branches: [test, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew :nfc-reader:testDebugUnitTest :nfc-reader:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :nfc-reader:assembleDebug --stacktrace

      - name: Name the APK
        run: cp nfc-reader/build/outputs/apk/debug/nfc-reader-debug.apk "nfc-reader-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-reader-${{ github.ref_name }}
          path: nfc-reader-${{ github.ref_name }}.apk
          if-no-files-found: error

      # On a v* tag, attach the APK to the matching release. The release itself
      # is created separately (gh release create vX.Y.Z ...); this just adds the
      # freshly built APK to it.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "nfc-reader-${{ github.ref_name }}.apk" --clobber --repo "${{ github.repository }}"
