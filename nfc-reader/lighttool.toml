[tool]
id = "com.lightcommunity.nfcreader"
label = "NFC Reader"
versionCode = 2
versionName = "1.0.0"
permissions = ["android.permission.NFC", "android.permission.INTERNET"]
capabilities = []
orientation = "portrait"
# Launcher icon for sideloaded installs (Obtainium, a normal Android launcher).
# LightOS itself shows the label, not an icon.
icon = "ic_launcher"
# Switch to "com.thelightphone.sdk.emulator" for emulator testing.
serverPackage = "com.lightos"
